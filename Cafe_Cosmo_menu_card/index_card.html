<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Cosmo Menu Card</title>
  <link rel="stylesheet" href="style_card.css" />
</head>
<body>
  <div class="card">
    <img src="mocha_card.png" alt="Cosmic Mocha" />
    <div class="card-content">
      <div class="card-header">
        <h2>Cosmic Mocha</h2>
        <span class="price">₹210</span>
      </div>
      <p>
        Indulge in rich espresso swirled with galaxy-dark chocolate and topped
        with stardust cream.
      </p>
    </div>
  </div>
</body>
</html>
